<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블록 플래너</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+KR:wght@400;600;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Share+Tech+Mono&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFBFE; --ink:#141A2A; --muted:#5E6780; --dim:#838BA0;
  --pb:#A9C1FF; --pb-hi:#D3E0FF; --pb-lo:#86A6F5; --pb-ink:#2A4596; --lav:#C3B6FF;
  --rim:linear-gradient(135deg,#FFFFFF 0%,#D3E0FF 30%,#A9C1FF 62%,#C3B6FF 100%);
  --glass:rgba(255,255,255,.58); --edge:rgba(255,255,255,.85); --edge-2:rgba(120,140,190,.22);
  --hl:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(160,180,230,.12);
  --sh:0 8px 24px rgba(80,100,160,.12),0 1px 2px rgba(80,100,160,.08);
  --blur:blur(22px) saturate(180%);
  --grid:rgba(90,105,150,.16); --grid2:rgba(90,105,150,.045); --line:rgba(90,105,150,.14);
  --accent:var(--pb-lo); --now:#7F9FF2; --card:#FFFFFF;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --num:var(--sans);
  --display:"Instrument Serif","Noto Serif KR",Georgia,serif;
  --serif:"Instrument Serif","Noto Serif KR",Georgia,serif;
  --paper:#FAFBFE; --school:#EEF2FB; --hair:rgba(20,30,60,.07); --deep:#3A57CF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pb-lo);outline-offset:3px}
.cy{display:none}

/* ── 흰 바탕 위 리퀴드 글라스 블롭 ── */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(95% 55% at 100% 0%,#DCE6FF 0%,rgba(220,230,255,0) 62%),radial-gradient(85% 50% at 0% 100%,#ECE8FF 0%,rgba(236,232,255,0) 65%),var(--paper)}
.blobs i{display:none!important;position:absolute;border-radius:43% 57% 62% 38% / 46% 38% 62% 54%;
  background:radial-gradient(90% 80% at 32% 26%,rgba(255,255,255,.95),rgba(236,242,255,.5) 45%,rgba(200,215,255,.28) 100%);
  animation:morph 22s ease-in-out infinite alternate;will-change:border-radius;contain:strict}
/* 스크롤·드래그·다이얼·시트 중엔 배경을 멈춰서 유리 효과 재계산을 없앰 */
body.busy .blobs i,body.sheet-open .blobs i{animation-play-state:paused}
.b1{width:300px;height:350px;right:-120px;top:70px;transform:rotate(18deg);
  box-shadow:inset -8px 8px 14px -4px rgba(255,255,255,1),inset 9px -8px 16px -4px rgba(140,168,255,.75),
    inset 26px -22px 44px -20px rgba(120,150,255,.4),inset -24px 24px 50px -24px rgba(195,182,255,.45),0 24px 60px rgba(110,140,230,.22)}
.b2{width:400px;height:370px;left:-190px;bottom:90px;animation-duration:26s;animation-delay:-8s;
  box-shadow:inset 10px -9px 16px -4px rgba(255,255,255,1),inset -9px 10px 18px -4px rgba(150,176,255,.8),
    inset -28px 28px 56px -24px rgba(120,150,255,.4),inset 28px -28px 60px -26px rgba(195,182,255,.45),0 24px 70px rgba(110,140,230,.2)}
.b3{width:150px;height:200px;right:-70px;bottom:250px;animation-duration:19s;animation-delay:-4s;
  box-shadow:inset -6px 6px 12px -3px rgba(255,255,255,1),inset 6px -6px 14px -4px rgba(150,176,255,.8),0 16px 40px rgba(110,140,230,.2)}
@keyframes morph{
  0%{border-radius:43% 57% 62% 38% / 46% 38% 62% 54%}
  50%{border-radius:58% 42% 40% 60% / 38% 55% 45% 62%}
  100%{border-radius:38% 62% 55% 45% / 60% 44% 56% 40%}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:12px 14px 14px;gap:10px}
.lg{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* ── 상단 ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.datebar{display:flex;align-items:center;gap:4px;min-width:0}
.icon{width:34px;height:34px;border-radius:999px;color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center;padding:0;
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.icon:hover{color:var(--ink)}
.date{border:0;background:transparent;padding:0 6px;text-align:left}
.nixie{display:block;font-family:var(--display);font-weight:400;font-size:48px;line-height:.95;letter-spacing:-.01em;color:var(--ink)}
.date small{display:block;margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.date small em{font-style:normal;color:var(--pb-ink);margin-left:6px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.dday{height:32px;border-radius:999px;padding:0 13px 0 12px;display:flex;align-items:center;gap:6px;max-width:170px;
  border:1px solid rgba(255,255,255,.9);color:var(--pb-ink);
  background:linear-gradient(180deg,var(--pb-hi),var(--pb));box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 12px rgba(134,166,245,.35)}
.dday small{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:6em}
.dday b{font-family:var(--display);font-size:21px;font-weight:400;line-height:1;white-space:nowrap}
.dday.soon{color:#fff;border-color:rgba(255,255,255,.35);background:linear-gradient(180deg,#5577EE,#3A57CF);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(58,87,207,.4)}
.dday.none{background:var(--glass);color:var(--muted);box-shadow:var(--hl),var(--sh)}
.ledbox{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.led{width:8px;height:8px;border-radius:50%;background:#D5DAE4}
.led.on{background:var(--pb-lo);box-shadow:0 0 10px 3px rgba(134,166,245,.7)}
.seg{display:flex;padding:4px;border-radius:999px;
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:linear-gradient(180deg,var(--pb-hi),var(--pb));color:var(--pb-ink);font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 10px rgba(134,166,245,.35)}

/* ── 화면 ── */
.bezel{position:relative;flex:1;min-height:0;display:flex}
.bezel-tag{display:none}
.screen{position:relative;flex:1;min-height:0;overflow:hidden}
.crt-over{display:none}
.carry{position:absolute;top:8px;left:0;right:0;z-index:4}
.carry button+button{margin-top:6px}
.carry button{width:100%;text-align:left;padding:10px 16px;font-size:14px;border-radius:999px;color:var(--ink)}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 16px;z-index:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* ── 타임라인 ── */
.timeline{position:relative;margin:16px 0 30px}
.hour{position:absolute;left:42px;right:0;border-top:1px solid var(--grid)}
.hour span{position:absolute;left:-38px;top:-10px;font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.lane{position:absolute;left:46px;right:4px;top:0;bottom:0;
  background-image:repeating-linear-gradient(to bottom,var(--grid2) 0 1px,transparent 1px var(--tick,18px))}
.now{position:absolute;left:36px;right:0;height:1.5px;border:0;z-index:4;pointer-events:none;
  background:linear-gradient(90deg,var(--now),rgba(127,159,242,.1))}
.now::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--now);box-shadow:0 0 8px rgba(127,159,242,.8)}

.blk{position:absolute;left:0;right:0;border-radius:14px;overflow:hidden;cursor:pointer;z-index:2;color:var(--ink);
  display:flex;align-items:stretch;transition:top .22s ease,height .22s ease;contain:layout style;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 11%,transparent),transparent 45%),rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(30,45,90,.05),0 6px 16px rgba(30,45,90,.06)}
.blk::before{content:"";position:absolute;left:12px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.blk.dragging{transition:none;z-index:6;box-shadow:var(--hl),0 18px 40px rgba(80,100,160,.25)}
.blk-body{flex:1;min-width:0;padding:7px 6px 7px 26px}
.title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.meta .tm{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.running{color:#fff;border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%),linear-gradient(180deg,#5577EE,#3A57CF);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 4px rgba(85,119,238,.18),0 12px 30px rgba(58,87,207,.45)}
.running::before{background:#fff;box-shadow:0 0 10px #fff}
.running .meta{color:rgba(255,255,255,.82)}
.running .st{font-family:var(--num);color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.running .st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;box-shadow:0 0 8px #fff}
.running.over .st{color:#FFD3D6}
.running .act{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none}
.running .act.on{background:#fff;color:#3A57CF}
.running .grip{background-image:radial-gradient(#fff 1.1px,transparent 1.4px);opacity:.55}
.running .resize::after{background:rgba(255,255,255,.5)}
.over .st{color:#E0656B}
.done{opacity:.72}
.done .title{color:var(--muted)}
.done .title span{text-decoration:line-through;text-decoration-thickness:1px}
.review{background:repeating-linear-gradient(to bottom,transparent 0 9px,color-mix(in srgb,var(--c) 10%,transparent) 9px 10px),color-mix(in srgb,var(--c) 7%,rgba(255,255,255,.55));
  border:1px solid color-mix(in srgb,var(--c) 30%,rgba(255,255,255,.8))}
.review .title{font-weight:500}
.meal{z-index:1;background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(226,161,90,.08) 9px 18px),#FFF7EC;
  border:1px dashed rgba(226,161,90,.6);box-shadow:none}
.meal::before{background:#E2A15A}
.meal .title{font-weight:500;color:#8A5A22}
.meal .tag{color:#8A5A22;background:#FCE9D2}
body.themed .meal{background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--ink) 5%,transparent) 9px 18px),var(--T-card);border-color:var(--muted)}
body.themed .meal .title,body.themed .meal .tag{color:var(--ink)}
.mband{position:absolute;left:0;right:0;z-index:0;pointer-events:none;
  border-top:1px dashed rgba(226,161,90,.6);border-bottom:1px dashed rgba(226,161,90,.6);
  background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(226,161,90,.09) 9px 18px),rgba(255,247,236,.55)}
.mband .mtag{border-color:rgba(226,161,90,.7);color:#8A5A22;background:#FFF7EC}
.mband .mlb{position:absolute;right:10px;bottom:4px;font-size:10.5px;font-weight:600;color:#A0703A;opacity:.85}
body.themed .mband{border-color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--ink) 5%,transparent) 9px 18px)}
body.themed .mband .mtag{background:var(--T-panel);color:var(--T-atext);border-color:var(--muted)}
body.themed .mband .mlb{color:var(--muted)}
.mealtog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px;font-size:14px;font-weight:600}
.mealtog input{width:18px;height:18px;accent-color:#E2A15A}
.mealtog small{flex-basis:100%;font-weight:400;font-size:12px;color:var(--muted)}
.lecture{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 15%,transparent),transparent 55%),rgba(255,255,255,.94);
  border:1px solid color-mix(in srgb,var(--c) 32%,rgba(255,255,255,.9))}
.lecture::before{width:0;height:0;border-radius:0;background:none!important;box-shadow:none!important;top:12px;left:12px;
  border-left:8px solid var(--c);border-top:5px solid transparent;border-bottom:5px solid transparent}
.lecture.compact::before{top:50%;margin-top:-5px}
.act.lp{width:auto;min-width:44px;padding:0 10px;font-size:11.5px;font-weight:600;border-radius:999px;font-variant-numeric:tabular-nums}
.act.lp.full{background:var(--deep);color:#fff;border-color:transparent}
.lecture.done{opacity:.72}
.key-sm{flex:none!important;width:52px;padding:0!important;flex-direction:column;gap:0!important}
.key-sm b{font-size:16px!important}
.key-sm span{font-size:10.5px!important}
.bar .key{padding:0 8px;gap:4px;min-width:0}
.bar .key span{white-space:nowrap}
.bar .key-iv b{font-size:13px}
.lpick{margin-top:2px}
.act.chk{color:var(--muted)}
.act.chk.on{color:#fff;border-color:transparent;background:var(--deep);box-shadow:0 0 0 3px rgba(58,87,207,.15)}
.review.done{opacity:.8}
.meta .tag{font-size:11.5px;font-weight:600;padding:0 8px;border-radius:999px;line-height:19px;margin:1px 0;
  color:color-mix(in srgb,var(--c) 70%,#1B2233);background:color-mix(in srgb,var(--c) 14%,#fff)}
.fixed{z-index:1;color:#EEF1FA;border:1px solid rgba(255,255,255,.12);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px),linear-gradient(180deg,#3C4566,#2A3150);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(30,40,80,.25)}
.fixed::before{background:#A9C1FF;box-shadow:0 0 8px rgba(169,193,255,.9)}
.fixed .meta{color:#B7BFD6}
/* 학교 수업: 조용한 레일. 교시 번호는 실제 순서라 번호를 씀 */
.school{z-index:1;border-radius:10px;color:var(--ink);background:var(--school);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px var(--hair)}
.school::before{display:none}
.school .per{position:absolute;left:8px;top:8px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  font:600 11.5px/1 var(--sans);color:var(--pb-ink);background:#fff;box-shadow:0 0 0 1.5px var(--c)}
.school .blk-body{padding:7px 10px 7px 38px}
.school .title{font-weight:500;font-size:14px}
.school.compact .per{top:50%;margin-top:-10.5px}
.school.jaseup{z-index:0;background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(125,156,240,.07) 7px 14px),rgba(255,255,255,.35);
  border:1.5px dashed rgba(125,156,240,.6);box-shadow:none}
.school.jaseup .title{color:var(--pb-ink);font-weight:600}
.school.jaseup .per{box-shadow:0 0 0 1.5px rgba(125,156,240,.6)}
.meta .was{text-decoration:line-through;color:var(--dim)}
.jband{position:absolute;left:0;right:0;z-index:0;pointer-events:none;
  border-top:1px dashed rgba(125,156,240,.45);border-bottom:1px dashed rgba(125,156,240,.45);
  background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(125,156,240,.06) 8px 16px)}
.jtag{pointer-events:auto;position:absolute;left:-47px;top:4px;width:41px;padding:3px 0;border-radius:8px;cursor:pointer;
  border:1px dashed rgba(125,156,240,.6);background:rgba(255,255,255,.88);color:var(--pb-ink);font:600 10px/1.25 var(--sans)}
body.themed .jband{border-color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--ink) 5%,transparent) 8px 16px)}
body.themed .jtag{background:var(--T-panel);color:var(--T-atext);border-color:var(--muted)}
.selfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.selfbtn{height:46px;border-radius:14px;border:1px solid rgba(125,156,240,.35);background:rgba(255,255,255,.75);color:var(--pb-ink);font-weight:600;font-size:13.5px;padding:0 10px}
.selfbtn.on{background:linear-gradient(180deg,var(--pb-hi),var(--pb));border-color:rgba(255,255,255,.9)}
.selfbtn.wide{grid-column:1 / -1;background:transparent;border-style:dashed}
.selfrow small{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.school.cur{background:#fff;box-shadow:0 0 0 1.5px var(--pb-lo),0 6px 16px rgba(125,156,240,.25)}
.memobar{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 14px;border-radius:999px;margin-top:8px;font:inherit;font-size:13px;text-align:left;cursor:pointer;
  color:var(--ink);background:rgba(255,248,214,.85);border:1px solid rgba(230,200,90,.55);box-shadow:0 0 0 1px var(--hair)}
.memobar .mk{flex:none;font-weight:700;font-size:12px;color:#8A6A10}
.memobar .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memobar .mt.muted{color:var(--muted)}
.memobar .mm{flex:none;font-size:12px;color:var(--muted)}
body.themed .memobar{background:var(--T-panel);border-color:var(--T-bd)}
body.themed .memobar .mk{color:var(--T-atext)}
.memoin{margin:12px 0 10px}
.memoin .in{flex:1;min-width:0}
.primary.sm{flex:none;height:48px;padding:0 18px}
.mscope{grid-template-columns:1fr 1fr!important;margin-bottom:12px}
.memolist{list-style:none;margin:0;padding:0}
.memolist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.memolist li:last-child{border-bottom:0}
.memolist .mtx{flex:1;min-width:0;font-size:14.5px;line-height:1.45;word-break:break-word}
.memolist .mtx small{display:block;font-size:11px;color:var(--dim)}
.memolist li.done .mtx{color:var(--dim);text-decoration:line-through}
.mchk{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:transparent;font-size:13px;padding:0}
.mchk[aria-pressed="true"]{background:var(--deep);border-color:transparent;color:#fff}
.mdel{flex:none;min-width:30px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--dim);font-size:12.5px;padding:0 6px}
.sessbar{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 14px;border-radius:999px;margin-top:8px;font-size:13px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px var(--hair)}
.sessbar .k{color:var(--muted);font-size:12.5px;flex:none}
.sessbar b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.sessbar .v{flex:1 1 auto}
.sessbar button{padding:0 10px}
.sessbar b.muted{color:var(--muted);font-weight:500}
.sessbar .v{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sessbar .v.bad{color:#C2414A;font-weight:600}
.sessbar .dot{width:7px;height:7px;border-radius:50%;background:var(--deep);box-shadow:0 0 0 4px rgba(58,87,207,.15);flex:none}
.sessbar button{margin-left:auto;flex:none;height:28px;padding:0 11px;border-radius:999px;border:0;font-size:12.5px;font-weight:600;
  color:var(--pb-ink);background:linear-gradient(180deg,var(--pb-hi),var(--pb))}
.sessbar button+button{margin-left:4px}
.sess-note{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.brk{position:absolute;left:0;right:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  background:repeating-linear-gradient(90deg,rgba(90,105,150,.10) 0 2px,transparent 2px 7px) left/100% 1px no-repeat}
.brk span{font-size:10.5px;color:var(--dim);background:rgba(255,255,255,.8);border-radius:999px;padding:0 7px;line-height:18px}
.brk.bad span{color:#fff;background:#D9555C;font-weight:600}
.brk.bad{background:linear-gradient(90deg,rgba(217,85,92,.07),rgba(217,85,92,.02))}
.swin{position:absolute;left:-8px;right:0;height:0;border-top:1.5px solid var(--deep);z-index:3;pointer-events:none}
.swin span{position:absolute;right:6px;top:-9px;font-size:10px;font-weight:700;color:#fff;background:var(--deep);border-radius:999px;padding:0 7px;line-height:17px}
.swin.end{border-top-style:dashed}
.brline{font-size:12px;margin:6px 0 0;color:#1E7A55;font-weight:600}
.brline.bad{color:#C2414A}
body.themed .sessbar{background:var(--T-panel);border-color:var(--T-bd);color:var(--ink)}
body.themed .sessbar button{background:var(--T-accent);color:var(--T-aink);box-shadow:var(--T-ash,none)}
body.themed .sessbar .dot{background:var(--deep)}
body.themed .brk span{background:var(--T-panel);color:var(--muted)}
.nowbar{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;margin-top:10px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px var(--hair),0 4px 14px rgba(30,45,90,.06);font-size:14px}
.nowbar .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.nowbar .dot.on{background:var(--deep);box-shadow:0 0 0 4px rgba(58,87,207,.15)}
.nowbar .k{color:var(--muted);font-size:12.5px;flex:none}
.nowbar b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .r{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
.fixed .blk-body{padding-right:14px}
.blk-actions{display:flex;align-items:flex-start;gap:6px;padding:7px 2px 0 0}
.act{width:32px;height:32px;flex:none;border-radius:999px;padding:0;font-size:11px;display:grid;place-items:center;color:var(--pb-ink);
  background:rgba(255,255,255,.75);border:1px solid var(--edge);box-shadow:var(--hl),0 2px 6px rgba(80,100,160,.12)}
.act.on{background:linear-gradient(180deg,var(--pb-hi),var(--pb));color:var(--pb-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 14px rgba(134,166,245,.55)}
.grip{width:20px;flex:none;touch-action:none;cursor:grab;opacity:.35;
  background-image:radial-gradient(#6E7890 1.1px,transparent 1.4px);background-size:6px 6px;background-position:center 7px;
  background-repeat:repeat-y;background-clip:content-box;padding:0 4px}
.resize{position:absolute;left:0;right:20px;bottom:0;height:12px;touch-action:none;cursor:ns-resize}
.resize::after{content:"";position:absolute;left:50%;bottom:4px;width:22px;height:2px;margin-left:-11px;border-radius:2px;background:rgba(110,125,165,.3)}
.compact .blk-body{display:flex;align-items:center;padding-top:0;padding-bottom:0}
.compact .meta{display:none}
.compact .blk-actions{align-items:center;padding-top:0}
.compact .act{width:26px;height:26px;font-size:10px}
.compact::before{top:50%;margin-top:-3px}
.tiny .blk-actions{display:none}
.empty{position:absolute;left:52px;right:10px;top:150px;color:var(--muted);font-size:14px;line-height:1.75;z-index:1;padding:18px 20px;border-radius:20px}
.empty b{color:var(--ink);font-weight:500}

/* ── 하단 ── */
.bar{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),0 14px 34px rgba(80,100,160,.16);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.key{height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;
  border:1px solid var(--edge);background:rgba(255,255,255,.7);box-shadow:var(--hl),0 2px 8px rgba(80,100,160,.1);color:var(--ink);transition:transform .08s}
.key:active{transform:scale(.97)}
.key b{font-family:var(--num);font-weight:400;font-size:19px;line-height:1}
.key span{font-size:14px;font-weight:500}
.key-red{flex:1.5;color:var(--pb-ink);border-color:rgba(255,255,255,.9);
  background:linear-gradient(180deg,var(--pb-hi),var(--pb));box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 18px rgba(134,166,245,.45)}
.key-red span{font-weight:600}
.key-bk,.key-iv{flex:1}
.key-bk b,.key-iv b{font-size:15px;color:var(--pb-lo)}
.knobbox{flex:none;display:flex}
.dial{position:relative;width:48px;height:48px;display:grid;place-items:center}
.dial svg{display:none}
.knob{--rot:0deg;width:48px;height:48px;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;
  background:radial-gradient(90% 80% at 32% 26%,#FFFFFF,#E4ECFF 55%,#C6D6FF 100%);
  box-shadow:inset -3px 3px 6px -1px #fff,inset 4px -4px 8px -2px rgba(134,166,245,.8),0 6px 16px rgba(134,166,245,.45)}
.knob-cap{position:absolute;inset:0;border-radius:50%;transform:rotate(var(--rot))}
.knob-cap i{position:absolute;left:50%;top:7px;width:2.5px;height:10px;margin-left:-1.25px;border-radius:2px;background:var(--pb-ink)}

/* ── 시트 ── */
.sheet-wrap{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(170,185,220,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-width:544px;margin:0 auto;border-radius:30px;color:var(--ink);
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;
  background:radial-gradient(60% 40% at 100% 0%,rgba(169,193,255,.4),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(195,182,255,.3),transparent 70%),rgba(255,255,255,.78);
  border:1px solid var(--edge);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--hl),0 30px 80px rgba(60,80,140,.25);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sh-head h2{font-family:var(--serif);font-size:21px;margin:0;font-weight:600;letter-spacing:-.02em}
.f{display:block;margin:16px 0}
.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.f small{display:block;font-size:12px;color:var(--dim);margin-top:7px}
.in{width:100%;height:48px;border:1px solid rgba(120,140,190,.2);border-radius:16px;background:rgba(255,255,255,.85);padding:0 16px;color:var(--ink);box-shadow:inset 0 1px 2px rgba(80,100,160,.08)}
.in::placeholder{color:var(--dim)}
.in:focus{outline:none;border-color:var(--pb);box-shadow:0 0 0 3px rgba(169,193,255,.35)}
.row{display:flex;gap:8px}
.row .in.unit{width:96px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 14px;font-size:14px;
  border:1px solid var(--edge);background:rgba(255,255,255,.7);box-shadow:var(--hl),0 2px 6px rgba(80,100,160,.08);color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--pb-hi),var(--pb));color:var(--pb-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 12px rgba(134,166,245,.35)}
.chip.add{border:1px dashed rgba(120,140,190,.35);background:transparent;box-shadow:none;color:var(--muted)}
.newcat{margin-top:10px}
.f>span.lbl-row{display:flex;justify-content:space-between;align-items:center}
.textbtn.sm{padding:0 2px;font-size:13px;font-weight:600}
.cat-list{display:flex;flex-direction:column;gap:8px;margin:14px 0 12px}
.cat-ed{display:flex;align-items:center;gap:8px}
.cat-ed .in{flex:1;min-width:0;height:44px}
.sw-dot{width:44px;height:44px;flex:none;border-radius:50%;padding:0;border:3px solid #fff;background:var(--c);
  box-shadow:0 0 0 1px rgba(120,140,190,.25),0 3px 8px rgba(80,100,160,.2)}
.sw-dot[aria-expanded="true"]{box-shadow:0 0 0 2px var(--pb-lo),0 3px 10px rgba(80,100,160,.25)}
.danger.sm{height:44px;padding:0 14px;font-size:13.5px;flex:none}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:12px;border-radius:18px;margin:0 0 4px;
  background:rgba(255,255,255,.7);border:1px solid var(--edge);box-shadow:var(--hl)}
.sw{aspect-ratio:1;width:100%;border-radius:50%;border:2px solid #fff;background:var(--c);padding:0;box-shadow:0 0 0 1px rgba(120,140,190,.22)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.custom{position:relative;overflow:hidden;display:block;cursor:pointer;background:conic-gradient(#f66,#fd6,#6d8,#6cf,#86f,#f6c,#f66)}
.sw.custom input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;border:0;padding:0}
.note{display:block;font-size:12px;color:var(--dim);margin-top:12px;line-height:1.6}
.dialset{position:relative;width:220px;height:220px;margin:4px auto 0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:50%}
.dialset.turning{cursor:grabbing}
.dialset svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dialset .tk{stroke:rgba(90,105,150,.28);stroke-width:1.5;stroke-linecap:round}
.dialset .tk.big{stroke:rgba(90,105,150,.5);stroke-width:2}
.dialset .trk{fill:none;stroke:rgba(120,140,190,.14);stroke-width:16}
.dialset .arc{fill:none;stroke:url(#dg);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .08s}
.dialset .disc{fill:rgba(255,255,255,.82);stroke:rgba(255,255,255,.95);stroke-width:1;filter:drop-shadow(0 6px 14px rgba(80,100,160,.16))}
.dialset .thumb{fill:#fff;stroke:#86A6F5;stroke-width:3;filter:drop-shadow(0 3px 6px rgba(80,100,160,.35));transition:r .12s}
.dialset.turning .thumb{r:14}
.dial-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial-mid output{font-family:var(--display);font-size:46px;font-weight:400;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.dial-mid small{margin-top:4px;font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:999px;font-size:20px;color:var(--pb-ink);
  border:1px solid var(--edge);background:rgba(255,255,255,.75);box-shadow:var(--hl),0 2px 8px rgba(80,100,160,.1)}
.stepper output{flex:1;text-align:center;font-family:var(--display);font-size:50px;font-weight:400;letter-spacing:-.01em;line-height:1.05}
.hint{margin-top:10px;font-size:13px;background:rgba(255,255,255,.6);border:1px solid var(--edge);border-radius:16px;padding:11px 14px;color:var(--muted);line-height:1.6}
.hint div+div{margin-top:6px}
.hint b{color:var(--ink);font-weight:500}
.hint button{border:0;color:var(--pb-ink);background:linear-gradient(180deg,var(--pb-hi),var(--pb));border-radius:999px;padding:2px 11px;margin-left:6px;font-size:12.5px;font-weight:600}
.timer-row{display:flex;gap:8px;margin:18px 0 4px}
.timer-row button{flex:1;height:48px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.75);box-shadow:var(--hl),0 2px 8px rgba(80,100,160,.1);color:var(--ink)}
.sh-foot{display:flex;gap:8px;margin-top:20px}
.primary{flex:1;height:52px;border:1px solid rgba(255,255,255,.9);border-radius:999px;font-weight:600;font-size:16px;color:var(--pb-ink);
  background:linear-gradient(180deg,var(--pb-hi),var(--pb));box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 22px rgba(134,166,245,.45)}
.ghost{height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.75);color:var(--ink)}
.danger{height:52px;padding:0 18px;border-radius:999px;color:#D9555C;background:rgba(255,255,255,.6);border:1px solid rgba(217,85,92,.35)}
.danger.arm{background:#F08A8F;color:#fff;border-color:transparent}
.textbtn{border:0;background:transparent;color:var(--pb-ink);padding:6px 0;font-size:14px;font-weight:500}

/* ── 결산 ── */
.seg button{padding:6px 12px}
.settle{padding:6px 2px 28px}
.settle h2{font-size:15px;font-weight:600;margin:26px 4px 10px;color:var(--ink)}
.settle-empty{padding:20px 22px;border-radius:20px;color:var(--muted);line-height:1.7;margin-top:10px}
.hero{display:flex;gap:16px;align-items:stretch;padding:16px;border-radius:24px;margin-top:6px}
.hero-r{flex:1;min-width:0;display:flex;flex-direction:column}
.hero-r .lbl{font-size:12.5px;color:var(--muted)}
.dval{font-family:var(--display);font-size:46px;line-height:1;letter-spacing:-.01em;margin:2px 0 2px}
.dval small{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-left:4px;letter-spacing:0}
.tier{font-size:13.5px;font-weight:600;color:var(--pb-ink);margin-bottom:10px}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:5px}
.meter span{width:26px;flex:none}
.meter i{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(20,30,60,.08);overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--deep)}
.meter.spd i b{background:var(--pb-lo)}
.meter.vol i b{background:#A9B6D8}
.meter em{width:64px;font-size:11.5px}
.meter.spd i u{position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:rgba(20,30,60,.35)}
.meter em{font-style:normal;width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.tier .bonus{font-style:normal;font-size:11.5px;font-weight:600;color:#1E7A55;background:#DFF5EA;border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.tier .pen{font-style:normal;font-size:11.5px;font-weight:600;color:#A8323A;background:#FCE4E5;border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.slist .penb{font-size:11px;font-weight:600;color:#A8323A;background:#FCE4E5;border-radius:999px;padding:0 7px;flex:none}
.slist .early{font-size:11px;font-weight:600;color:#1E7A55;background:#DFF5EA;border-radius:999px;padding:0 7px;flex:none}
.hint2{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
/* 원소 칸: 주기율표 한 칸처럼 */
.el{position:relative;aspect-ratio:1;border-radius:12px;color:var(--ink);
  background:linear-gradient(155deg,color-mix(in srgb,var(--ec) 38%,#fff),color-mix(in srgb,var(--ec) 78%,#fff));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 0 1px color-mix(in srgb,var(--ec) 60%,rgba(20,30,60,.2))}
.el.dark{color:#fff;background:linear-gradient(155deg,color-mix(in srgb,var(--ec) 80%,#fff),var(--ec))}
.el .z{position:absolute;left:8px;top:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.el .sym{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;font-family:var(--display);font-size:30px;line-height:1}
.el .nm{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:10px;font-weight:500;opacity:.85}
.el .dn{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9px;font-variant-numeric:tabular-nums;opacity:.7}
.el.big{width:132px;flex:none;border-radius:18px}
.el.big .z{left:12px;top:10px;font-size:14px}
.el.big .sym{font-size:66px}
.el.big .nm{bottom:24px;font-size:13px}
.el.big .dn{bottom:8px;font-size:11px}
.ladder{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 2px 4px;margin:0 -2px}
.ladder::-webkit-scrollbar{display:none}
.ladder>div{flex:none;width:52px;text-align:center}
.ladder small{display:block;font-size:10.5px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.ladder .el{opacity:.38}
.ladder .el.got{opacity:.75}
.ladder .el.on{opacity:1;box-shadow:0 0 0 2px var(--deep),0 6px 14px rgba(58,87,207,.3)}
.ladder .el .nm{display:none}
.ladder .el .dn{bottom:3px;font-size:8px}
.ladder .el .sym{font-size:21px;transform:translateY(-36%)}
.ladder .el .z{font-size:9px;left:6px;top:4px}
.slist{list-style:none;margin:0;padding:4px 14px;border-radius:20px}
.slist li{padding:12px 0;border-bottom:1px solid var(--line)}
.slist li:last-child{border-bottom:0}
.slist .r1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slist .r1 i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.slist .r1 b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .k{font-size:11.5px;color:var(--muted);padding:0 7px;border-radius:999px;background:rgba(20,30,60,.05);flex:none}
.slist .pm{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:3px;border-radius:12px;background:rgba(20,30,60,.05)}
.prog button{height:32px;border:0;border-radius:9px;background:transparent;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog button[aria-pressed="true"]{background:#fff;color:var(--pb-ink);font-weight:600;box-shadow:0 1px 3px rgba(30,45,90,.15)}
.prog button:last-child[aria-pressed="true"]{background:var(--deep);color:#fff}
.fin{display:block;font-size:12.5px;color:var(--pb-ink);font-weight:500;padding-left:15px}
.fin.run{color:var(--deep)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{text-align:center}
.wk small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.wk.cur small{color:var(--deep);font-weight:600}
.wk.cur .el{box-shadow:0 0 0 2px var(--deep)}
.el.mini .nm,.el.mini .dn{display:none}
.el.mini .z{font-size:9px;left:5px;top:3px}
.el.mini .sym{font-size:20px;transform:translateY(-34%)}
.el.none{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(20,30,60,.12);border-radius:12px}
.rule{font-size:12px;color:var(--dim);line-height:1.65;margin:22px 4px 0}
/* ── 도감 ── */
.dexbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px 10px 10px;border-radius:18px;margin:6px 0 10px;text-align:left;color:var(--ink)}
.mini-els{display:flex;gap:3px}
.mini-els i{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:400 15px/1 var(--display);font-style:normal;
  background:color-mix(in srgb,var(--ec) 70%,#fff);box-shadow:0 0 0 1px color-mix(in srgb,var(--ec) 60%,rgba(20,30,60,.2))}
.mini-els i.dark{background:var(--ec);color:#fff}
.mini-els i.none{--ec:#E4E8F1;color:var(--dim)}
.dexbtn .t{font-weight:600}
.dexbtn .c{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

button.dcard{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:block;width:100%;align-self:start;text-align:center}

/* ── 특수 원소 코팅 (도감·결산 타일) ── */
.el.fx{overflow:hidden}
.el.fx::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;

  box-shadow:0 0 0 1px #C99A3A,0 0 16px rgba(240,200,90,.7),0 0 36px rgba(240,190,70,.3),inset 0 1px 0 rgba(255,255,255,.85)}
.el.fx-Pt{color:#262D3A;background:linear-gradient(135deg,#FFFFFF 0%,#DCE1E9 24%,#A5AEBB 48%,#F4F6F9 64%,#BAC2CD 82%,#FFFFFF 100%);

.el.fx-Og{color:#1B1433;background:conic-gradient(from 210deg,#FF9AD5,#9A8CFF,#6FE3FF,#B6FFB0,#FFE58A,#FF9AD5);

.el.fx-U{color:#0D2A07;background:radial-gradient(circle at 50% 42%,#EDFFDD,#A4EA72 45%,#3F8C2C 100%);

@keyframes uPulse{50%{box-shadow:0 0 0 1px #7BD957,0 0 22px rgba(140,255,100,1),0 0 56px rgba(120,255,90,.6)}}
.el.fx-Bi{color:#2A1B3D;background:linear-gradient(135deg,#F7C6FF,#9FD3FF 25%,#FFE89A 50%,#C0A8FF 72%,#8CF0D8 100%);
  box-shadow:0 0 0 1px rgba(160,120,220,.6),0 0 16px rgba(205,155,255,.6)}
.el.fx-Hg{color:#1F2530;background:linear-gradient(180deg,#FFFFFF 0%,#CBD0D8 34%,#7E8794 54%,#EEF0F3 72%,#9BA3AF 100%);

.el.fx-Rn{color:#10352A;background:radial-gradient(circle at 50% 40%,#F4FFF8,#C2EDDA 50%,#80C6AF);
  box-shadow:0 0 0 1px #8FCDB8,0 0 16px rgba(140,240,200,.75),0 0 36px rgba(140,240,200,.3)}
.ladder .el.fx:not(.on):not(.got){filter:saturate(.5)}
/* ── 금단 원소 ── */
.dex h3.forbh{color:#B0171C}
.el.forbt{background:#0B0B0D;color:#FF3B30;box-shadow:0 0 0 1px #4A0D0D,0 0 12px rgba(255,40,40,.35)}
.el.forbt .sym{text-shadow:0 0 8px rgba(255,40,40,.9),0 0 22px rgba(255,0,0,.45)}
.el.forbt .z,.el.forbt .dn{color:#FF6B63;opacity:.85}
.el.forbt.locked-f{background:repeating-linear-gradient(135deg,#0B0B0D 0 5px,#150808 5px 10px);box-shadow:inset 0 0 0 1.5px #3A0A0A}
.el.forbt.locked-f .sym{color:rgba(255,50,40,.35);text-shadow:none}
.dcard.forbc b{color:#B0171C}
.dcard.forbc.off b{color:#C98A8C}
.dcard.forbc small em{color:#B24B50}
.el.at-live{animation:atFlick 2.4s steps(1) infinite}
@keyframes atFlick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.35}50%{opacity:1}83%{opacity:.6}84%{opacity:1}}
.el.at-stable{animation:none;box-shadow:0 0 0 1px #8A1515,0 0 16px rgba(255,40,40,.6)}
.el.at-dead{background:#0B0B0D;color:rgba(255,59,48,.28);box-shadow:inset 0 0 0 1.5px #2A0808}
.el.at-dead .sym{text-decoration:line-through;text-decoration-thickness:2px;text-shadow:none}
.el.at-dead .dn{color:rgba(255,90,80,.6)}
.pc.want.forb{box-shadow:inset 0 0 0 1px rgba(220,30,30,.55)}
.pc.got.forb{background:#0B0B0D;color:#FF3B30;box-shadow:0 0 0 1px #6A1010,0 0 6px rgba(255,40,40,.5)}
/* ── 원소 정보: 암전 + 흰 명조 타이틀 카드 ── */
.eva{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  background:#000;color:#fff;cursor:pointer;animation:evaDim .28s ease-out;
  font-family:"Noto Serif KR","Times New Roman",serif;padding:calc(24px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px))}
@keyframes evaDim{from{opacity:0}to{opacity:1}}
.eva{align-items:flex-start}
.eva-wrap{display:flex;align-items:center;gap:36px;margin:auto}
.bohr{flex:none;display:block}
@media (max-width:759px){.eva-wrap{flex-direction:column;align-items:flex-start;gap:0}.bohr{align-self:center;margin-bottom:-6px}}
.eva-in{position:relative;width:min(88vw,440px);padding-right:34px}
.eva hr{border:0;border-top:2px solid #fff;margin:10px 0 16px}
.e-top{display:flex;justify-content:space-between;font-size:14px;font-weight:900;letter-spacing:.04em}
.eva{background:radial-gradient(60% 38% at 30% 40%,var(--glow,transparent),transparent 72%),#000}
.e-sym{display:inline-block;font-size:clamp(130px,42vw,200px);font-weight:900;line-height:.84;letter-spacing:-.03em;transform:scaleX(.86);transform-origin:left;white-space:nowrap;padding-right:.08em}
.e-ko{font-size:34px;font-weight:900;line-height:1.1;margin-top:12px;white-space:nowrap}
.e-ko span{font-size:15px;font-weight:600;margin-left:12px;letter-spacing:.1em;opacity:.75}
.fxt-plain{text-shadow:0 0 18px rgba(255,255,255,.35),0 0 42px rgba(255,255,255,.12)}
.fxt{-webkit-background-clip:text;background-clip:text;color:transparent}
.fxt-Au{background-image:linear-gradient(175deg,#FFF7D6 0%,#F4D57A 30%,#B8862B 52%,#FFE9A6 70%,#C99633 100%);
  filter:drop-shadow(0 0 10px rgba(245,205,95,.8)) drop-shadow(0 0 34px rgba(240,180,60,.4))}
.fxt-Pt{background-image:linear-gradient(175deg,#FFFFFF 0%,#DDE3EC 28%,#9AA3B2 52%,#F4F7FB 70%,#B7BFCC 100%);
  filter:drop-shadow(0 0 10px rgba(225,235,255,.8)) drop-shadow(0 0 34px rgba(170,195,255,.35))}
.fxt-Os{background-image:linear-gradient(175deg,#E3EAFF 0%,#8FA5E6 30%,#3F5192 55%,#B8C7F5 74%,#51639F 100%);
  filter:drop-shadow(0 0 12px rgba(110,140,240,.85)) drop-shadow(0 0 40px rgba(80,110,230,.45))}
.fxt-Og{background-image:linear-gradient(100deg,#FF9AD5,#9A8CFF,#6FE3FF,#B6FFB0,#FFE58A,#FF9AD5);background-size:300% 100%;
  animation:holoText 5s linear infinite;filter:drop-shadow(0 0 12px rgba(170,130,255,.85)) drop-shadow(0 0 40px rgba(111,227,255,.4))}
@keyframes holoText{to{background-position:300% 0}}
.fxt-U{background:none;color:#D4FFB0;text-shadow:0 0 6px #8CFF5C,0 0 20px #5BFF2E,0 0 52px rgba(90,255,40,.65);animation:uGlow 2.8s ease-in-out infinite}
@keyframes uGlow{50%{text-shadow:0 0 8px #A6FF7E,0 0 30px #6BFF3A,0 0 80px rgba(90,255,40,.8)}}
.fxt-Bi{background-image:linear-gradient(120deg,#F7C6FF,#9FD3FF 25%,#FFE89A 50%,#C0A8FF 72%,#8CF0D8);
  filter:drop-shadow(0 0 10px rgba(210,160,255,.7))}
.fxt-Hg{background-image:linear-gradient(180deg,#FFFFFF 0%,#C9CED6 32%,#6F7887 52%,#EEF1F5 70%,#98A0AC 100%);
  filter:drop-shadow(0 0 10px rgba(230,238,250,.75))}
.fxt-Rn{background:none;color:#E6FFF4;text-shadow:0 0 8px #9CF5D4,0 0 26px rgba(110,235,190,.8),0 0 60px rgba(110,235,190,.35)}
.eva.has-fx .e-ko{text-shadow:0 0 16px rgba(255,255,255,.25)}
.eva.red{color:#FF2A22}
.eva.red hr{border-top-color:#FF2A22;box-shadow:0 0 8px rgba(255,40,30,.6)}
.eva.red .e-close{color:#FF2A22}
.eva.red .e-lbl{opacity:.7}
.eva.red .e-cond,.eva.red .e-rec,.eva.red .e-ko,.eva.red .e-top,.eva.red .e-vert{text-shadow:0 0 12px rgba(255,30,20,.45)}
.fxt-red{color:#FF2A22;text-shadow:0 0 10px rgba(255,40,30,.95),0 0 34px rgba(255,0,0,.6),0 0 80px rgba(255,0,0,.35);animation:redPulse 3s ease-in-out infinite}
@keyframes redPulse{50%{text-shadow:0 0 14px rgba(255,60,40,1),0 0 44px rgba(255,0,0,.75),0 0 110px rgba(255,0,0,.45)}}
.eva.red.unknown .e-sym{color:rgba(255,42,34,.8);text-shadow:0 0 24px rgba(255,0,0,.35)}
.e-row{display:flex;align-items:baseline;gap:8px;margin-top:14px;font-size:14px;font-weight:600}
.e-row b{font-size:26px;font-weight:900;margin-right:10px}
.e-row small{font-size:12px;margin-left:-6px}
.e-lbl{font-size:13px;font-weight:600;opacity:.75;margin-top:14px}
.e-lbl:first-of-type{margin-top:0}
.e-cond{font-size:25px;font-weight:900;line-height:1.3;margin-top:4px;transform:scaleX(.88);transform-origin:left;width:113%}
.e-rec{font-size:19px;font-weight:900;line-height:1.4;margin-top:4px}
.e-vert{position:absolute;right:0;top:48px;writing-mode:vertical-rl;font-size:15px;font-weight:900;letter-spacing:.35em}
.e-close{font-size:11.5px;opacity:.45;margin-top:28px;font-family:var(--sans)}
.eva.unknown .e-ko{opacity:.9}
.eva .c1,.eva .c2,.eva .c3,.eva .c4,.eva .c5,.eva .c6{animation:evaCut .06s steps(2,jump-none) both}
.eva .c1{animation-delay:.08s}.eva .c2{animation-delay:.18s}.eva .c3{animation-delay:.3s}
.eva .c4{animation-delay:.42s}.eva .c5{animation-delay:.52s}.eva .c6{animation-delay:.62s}
@keyframes evaCut{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.eva .c1,.eva .c2,.eva .c3,.eva .c4,.eva .c5,.eva .c6{animation:none}}
/* ── 기록 ── */
.stats{padding:6px 2px 28px}
.stats h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:30px 4px 14px;color:var(--ink);letter-spacing:-.02em}
.lead{position:relative;font-size:14px;line-height:1.6;margin:10px 0 0;padding:18px 20px 20px;border-radius:24px;color:var(--muted)}
.lead b{display:block;font-family:var(--display);font-size:76px;font-weight:400;letter-spacing:-.02em;line-height:1;color:var(--ink);margin:4px 0 2px}
.cat-row{position:relative;border-radius:22px;padding:16px 18px 18px;margin-bottom:10px;
  background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 60%),var(--glass)}
.cat-row::before{content:"";position:absolute;left:18px;top:24px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.cat-row .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-left:14px}
.cat-row .h b{font-weight:600;font-size:15.5px}

.cat-row p{margin:6px 0 12px;font-size:13.5px;color:var(--muted)}
.cat-row p b{color:var(--ink);font-weight:500}
.cmp{position:relative;height:4px;border-radius:2px;background:rgba(90,105,150,.1)}
.cmp .a{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--pb-hi),var(--pb-lo))}
.cmp .e{position:absolute;top:-5px;bottom:-5px;width:1.5px;background:var(--ink)}
.legend{font-size:12px;color:var(--dim);margin:-8px 4px 12px}
.log{list-style:none;margin:0;padding:4px 18px;border-radius:22px}
.log li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log .d{color:var(--dim);font-size:13px;width:40px;flex:none;font-family:var(--num)}
.log .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .v{font-family:var(--num);white-space:nowrap;color:var(--muted)}
.log .v b{color:var(--ink);font-weight:500}
.log button{border:0;background:transparent;color:var(--dim);width:30px;height:30px;border-radius:999px}
.sync{font-size:12.5px;color:var(--dim);margin:24px 4px 0}
.stats-empty{color:var(--muted);line-height:1.75;margin-top:24px;padding:20px 22px;border-radius:24px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:rgba(255,255,255,.85);border:1px solid var(--edge);box-shadow:var(--hl),var(--sh);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:14px;max-width:88%;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;text-align:center}
.toast.show{opacity:1}

/* 테마 고르기 */
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.thcard{border:0;padding:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}
.thcard .pv{position:relative;display:block;aspect-ratio:1.4;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(20,30,60,.12)}
.thcard .pv i{position:absolute;left:12%;right:12%;top:52%;height:22%;border-radius:6px;border:1px solid}
.thcard .pv u{position:absolute;right:12%;bottom:8%;width:34%;height:12%;border-radius:999px}
.thcard .pv b{position:absolute;left:12%;top:12%;font:400 26px/1 "Instrument Serif",Georgia,serif}
.thcard.on .pv{box-shadow:0 0 0 2.5px var(--deep)}
.thcard.lock .pv{filter:grayscale(.85) brightness(.9)}
.thcard.lock .pv::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;background:rgba(0,0,0,.25)}
.thcard .nm{display:block;font-weight:600;font-size:14px;margin-top:7px}
.thcard small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.thbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;border-radius:18px;margin:0 0 10px;text-align:left;color:var(--ink)}
.thbtn .sw{width:28px;height:28px;border-radius:8px;flex:none;box-shadow:0 0 0 1px rgba(20,30,60,.15)}
.thbtn .t{font-weight:600}
.thbtn .c{margin-left:auto;font-size:13px;color:var(--muted)}
/* 결정 보존권 */
.frz{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 16px;border-radius:18px;margin:10px 0 0;font-size:14px}
.frz b{font-weight:600}
.frz button{margin-left:auto;border:0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;background:linear-gradient(180deg,#E6F4FF,#B9DDF7);color:#1D4E75}
.frz small{flex-basis:100%;font-size:12px;color:var(--muted)}
.el.frz-t{background:linear-gradient(155deg,#F2FAFF,#CFE9FA);box-shadow:inset 0 0 0 1.5px #A9D3EE;display:grid;place-items:center;font-size:18px}

/* ── 추가 고르기 ── */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:18px;text-align:left;color:var(--ink);
  background:rgba(255,255,255,.75);border:1px solid var(--edge);box-shadow:var(--hl),0 2px 8px rgba(80,100,160,.08)}
.pick button:first-child{grid-column:1 / -1;background:linear-gradient(180deg,var(--pb-hi),var(--pb));color:var(--pb-ink);border-color:rgba(255,255,255,.9)}
.pick b{font-size:16px;font-weight:600}
.pick i{font-style:normal;font-size:20px;line-height:1;margin-bottom:6px;opacity:.8}
.pick small{font-size:12px;color:var(--muted)}
.pick button:first-child small{color:inherit;opacity:.75}
body.themed .pick button{background:var(--T-panel);border:1px solid var(--T-bd);box-shadow:var(--T-psh,none);color:var(--ink)}
body.themed .pick button:first-child{background:var(--T-accent);color:var(--T-aink);box-shadow:var(--T-ash,none)}
#scroller{touch-action:pan-x pan-y}
.bar .key-red{flex:2}
.bar .key-fs{flex:none;width:48px;padding:0}
.bar .key-fs b{font-size:18px}
.key.on-focus{color:var(--deep);font-variant-numeric:tabular-nums}
/* ── 결산: 끝난 항목은 한 줄로, 점수는 영수증으로 ── */
.slist li.fold .r1{margin-bottom:0}
.slist li.fold .r1 b{color:var(--muted);font-weight:500}
.slist li.fold .pm{color:var(--muted)}
.slist .undo{flex:none;border:0;background:transparent;color:var(--dim);font-size:12px;padding:2px 0 2px 6px;text-decoration:underline;text-underline-offset:3px}
.rcpt{border-radius:20px;padding:14px 18px;margin-top:10px;font-size:13.5px}
.rcpt .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--muted)}
.rcpt .ln b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rcpt .ln.plus b{color:#1E7A55}
.rcpt .ln.minus b{color:#C2414A}
.rcpt .ln small{display:block;font-size:11.5px;color:var(--dim)}
.rcpt .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;color:var(--ink);font-weight:600}
.rcpt .tot b{font-family:var(--display);font-size:22px;font-weight:400}
.rcpt details{margin-top:8px}
.rcpt summary{font-size:12px;color:var(--dim);cursor:pointer}
.rcpt .rule{margin:8px 0 0}
body.themed .rcpt .ln.plus b{color:var(--T-atext)}
/* ── 몰입 화면 ── */
.focus{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;color:#F4F6FB;overflow-y:auto;
  background:radial-gradient(70% 45% at 50% 38%,color-mix(in srgb,var(--fc,#86A6F5) 22%,transparent),transparent 72%),#05070C;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));animation:evaDim .25s ease-out}
.fx-in{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:14px}
.fx-top{display:flex;align-items:center;gap:8px;font-size:15px;max-width:100%}
.fx-top i{width:8px;height:8px;border-radius:50%;background:var(--fc);box-shadow:0 0 10px var(--fc);flex:none}
.fx-top b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-top span{color:rgba(244,246,251,.55);font-size:13px;flex:none}
.fx-stage{position:relative;width:min(80vw,320px);aspect-ratio:1;display:grid;place-items:center}
.fx-stage canvas{position:absolute;inset:0;margin:auto;opacity:.32}
.fx-stage svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fx-stage .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3}
.fx-stage .arc{fill:none;stroke:var(--fc);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray 1s linear;filter:drop-shadow(0 0 6px var(--fc))}
.fx-mid{position:relative;text-align:center}
.fx-mid output{display:block;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(64px,22vw,96px);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fx-mid small{display:block;margin-top:6px;font-size:13px;letter-spacing:.08em;color:rgba(244,246,251,.6)}
.fx-tom{display:flex;gap:7px}
.fx-tom i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}
.fx-tom i.on{background:var(--fc);border-color:var(--fc)}
.fx-meta{font-size:12.5px;color:rgba(244,246,251,.55);text-align:center;line-height:1.6}
.fx-btns{display:flex;gap:8px;width:100%;margin-top:6px}
.fx-btns button{flex:1;height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#F4F6FB;font-size:15px;font-weight:500}
.fx-btns button.pri{background:#F4F6FB;color:#05070C;border-color:transparent;font-weight:600}
.fx-seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.06)}
.fx-seg button{border:0;background:transparent;color:rgba(244,246,251,.55);font-size:12.5px;padding:5px 14px;border-radius:999px}
.fx-seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}
.focus.brk-ph .arc{stroke:#8FE3B8;filter:drop-shadow(0 0 6px #8FE3B8)}
.focus.ready .fx-mid output{animation:redPulse 0s,fxBlink 1.4s ease-in-out infinite}
@keyframes fxBlink{50%{opacity:.35}}

/* ── 상단 상태판: 지금·공부시간·메모를 카드 하나로 ── */
.dash{margin-top:10px;border-radius:20px;overflow:hidden;
  background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px var(--hair),0 4px 14px rgba(30,45,90,.06)}
.dash:not(:has(>:not([hidden]))){display:none}
.dash>.nowbar,.dash>.sessbar,.dash>.memobar{height:36px;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:13px}
.dash>:not([hidden])~:not([hidden]){border-top:1px solid var(--line)}
.dash>.nowbar{padding:0 14px}
.dash>.sessbar{padding:0 6px 0 14px}
.dash .sessbar button{height:26px;padding:0 10px;font-size:12px}
.dash>.memobar .mk{display:inline-flex;align-items:center;gap:6px}
.dash>.memobar .mk::before{content:"";width:7px;height:7px;border-radius:2px;background:#E6B94A;transform:rotate(45deg)}
.dash>.memobar{background:linear-gradient(90deg,rgba(255,236,170,.32),transparent 70%)}
.dash .k{min-width:30px;flex:none;white-space:nowrap}
body.themed .dash{background:var(--T-panel);border:1px solid var(--T-bd);box-shadow:var(--T-psh,none);-webkit-backdrop-filter:none;backdrop-filter:none}
body.themed .dash>.nowbar,body.themed .dash>.sessbar,body.themed .dash>.memobar{background:transparent;border:0;box-shadow:none}
body.themed .dash>:not([hidden])~:not([hidden]){border-top:1px solid var(--line)}
body.themed .dash>.memobar .mk::before{background:var(--deep)}
/* ── 블록 손잡이: 점 기둥 대신 가운데 점 세 개 ── */
.grip,body.themed .grip,.running .grip{position:relative;background-image:none;color:inherit}
.grip::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:16px;margin:-8px 0 0 -2px;
  background-image:radial-gradient(currentColor 1.3px,transparent 1.7px);background-size:4px 6px;background-repeat:repeat-y}
.compact .grip::after{height:10px;margin-top:-5px}
/* ── 쉬는시간: 칸에 안 들어가는 짧은 쉬는시간은 글씨 없이 선만 ── */
.brk.slim span{display:none}

/* ── 완료 블록: 줄 긋기 대신 체크 배지, 카드 그림자 빼고 조용하게 ── */
.blk.done{opacity:1;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px var(--hair)}
.blk.done::before{display:none}

.blk.done .meta{color:var(--dim)}
.dchk{position:absolute;left:7px;top:10px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
  font:700 9px/1 var(--sans);font-style:normal;color:#fff;background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 18%,transparent)}
.compact .dchk{top:50%;margin-top:-7.5px}
.tiny .dchk{width:12px;height:12px;margin-top:-6px;font-size:7.5px}
body.themed .blk.done{opacity:1;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);box-shadow:none}
body.themed .blk.done .title{color:var(--muted)}
body.th-blueprint .dchk{background:#fff;color:#000;box-shadow:none}
body.th-blob .blk.done .title{color:#A9A9B6}
/* ── 도감 가시성: 원소 칸은 늘 밝은 바탕이라 글자는 테마와 상관없이 진하게 ── */
.el{color:#141A2A}

.pc.got{color:#141A2A}

body.themed .pc.got{background:color-mix(in srgb,var(--ec) 80%,#fff)}

body.th-catalog .dex,body.th-catalog .settle,body.th-catalog .stats{background:rgba(250,249,246,.86);border-radius:22px;padding-left:10px;padding-right:10px;margin-top:4px}
body.th-soviet .dcard b{color:#F1EAD6}

<body>
<div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="app">
  <div class="topwrap" id="topwrap">
    <header class="top">
      <div class="datebar">
        <button class="icon" id="prev" aria-label="이전 날">‹</button>
        <button class="date" id="dateBtn" aria-label="오늘로 이동"><span class="nixie" id="dateMain"></span><small id="dateSub"></small></button>
        <button class="icon" id="next" aria-label="다음 날">›</button>
      </div>
      <div class="right">
        <span id="led" hidden></span>
        <div class="seg" role="tablist">
          <button role="tab" data-view="plan" aria-selected="true">계획</button>
          <button role="tab" data-view="settle" aria-selected="false">결산</button>
        </div>
        <button class="dday" id="ddayBtn" aria-label="디데이 설정"></button>
      </div>
    </header>
    <div class="dash" id="dash">
    <div class="sessbar" id="sessbar" hidden></div>
    <button class="memobar" id="memobar" aria-label="메모 열기"></button>
    </div>
  </div>
  <div class="bezel">
  <div class="screen" id="screen">
    <div class="carry" id="carry" hidden></div>
    <main id="scroller">
      <div class="timeline" id="tl"></div>
      <section class="settle" id="settle" hidden></section>
      <section class="stats" id="stats" hidden></section>
      <section class="dex" id="dex" hidden></section>
    </main>
    <div class="crt-over" aria-hidden="true"></div>
  </div>
  <span class="bezel-tag cy" aria-hidden="true">ПЛАНШЕТ · ЭЛТ-7</span>
  </div>
  <footer class="bar" id="bar">
    <button class="key key-red" id="addBtn"><b>+</b><span>추가</span></button>
    <button class="key key-iv" id="focusBtn" aria-label="몰입 화면"><b>◎</b><span>몰입</span></button>
    <button class="key key-iv key-fs" id="fsBtn" aria-label="전체 화면"><b>⛶</b></button>
  </footer>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
let PX = 1.8; try{ const z = +localStorage.getItem('blockplanner.zoom'); if(z >= 1.2 && z <= 3.2) PX = z; }catch(e){}
const SNAP = 5, DAY_START = 6*60, LS = 'blockplanner.v1';
const PALETTE = ['#3E6FD8','#1E9E7A','#C2457A','#8A5CD1','#D9822B','#2A9BB8','#7A8699','#B5832E'];
const WEEK = ['일','월','화','수','목','금','토'];
const CYR = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const DEFAULT = {v:1,updatedAt:0,lastCat:'math',
  cats:[{id:'math',name:'수학',color:'#3E6FD8'},{id:'eng',name:'영어',color:'#1E9E7A'},{id:'kor',name:'국어',color:'#C2457A'},{id:'sci',name:'과학',color:'#8A5CD1'},{id:'etc',name:'기타',color:'#7A8699'}],
  days:{},log:[],fixed:[]};

const $ = s => document.querySelector(s);
const tl = $('#tl'), scroller = $('#scroller'), statsEl = $('#stats'), settleEl = $('#settle'), dexEl = $('#dex'), sheetWrap = $('#sheetWrap'), sheet = $('#sheet');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const uid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const round5 = x => Math.max(5, Math.round(x/5)*5);
const ceil5 = x => Math.ceil(x/5)*5;
const fmt = m => pad(Math.floor(m/60)%24) + ':' + pad(m%60);
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
const dateOf = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k,n) => { const d = dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); };
const parseTime = s => { if(!s) return null; const [h,m] = s.split(':').map(Number); return isNaN(h) ? null : h*60 + (m||0); };
function clock(ms){ const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  return h ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss); }

/* 학교 시간표: 교시 시작 시각 + 요일별 과목 (월=1 … 금=5) */
const PERIODS = [[8,20],[9,20],[10,20],[11,20],[13,10],[14,10],[15,10]];
const TIMETABLE = {
  1:['', '통사A','C_수이C','영어A','통사D','국사','음악'],
  2:['체육1','수학','국어B','실험','C_수이C','영어A',''],
  3:['통사C','음악','국사','국어A','영어B','통사B','생명'],
  4:['국어A','영어B','화학','국사','지구','국어B',''],
  5:['수학','음악','체육1','물리','','','']
};
function schoolSeed(){
  const out = [];
  for(const wd in TIMETABLE) TIMETABLE[wd].forEach((t, i) => {
    out.push({id:`s${wd}-${i+1}`, title:t || '미정', start:PERIODS[i][0]*60 + PERIODS[i][1], dur:50, days:[+wd], skip:[], school:true, period:i+1, ...(t ? {} : {blank:true})});
  });
  return out;
}
function normalize(s){
  const o = Object.assign(clone(DEFAULT), s || {});
  if(!Array.isArray(o.cats) || !o.cats.length) o.cats = clone(DEFAULT.cats);
  if(!o.days || typeof o.days !== 'object') o.days = {};
  for(const k in o.days) if(Array.isArray(o.days[k])) o.days[k] = o.days[k].filter(b => !b.buffer);
  if(!Array.isArray(o.log)) o.log = [];
  if(!Array.isArray(o.fixed)) o.fixed = [];
  if(!('dday' in o)) o.dday = {title:'시험', date:'2026-10-12'};
  if(!o.schoolSeeded){ o.fixed = o.fixed.filter(f => !f.school).concat(schoolSeed()); o.schoolSeeded = true; o.schoolBlankSeeded = true; }
  if(!o.lunchSeeded){
    if(Object.keys(TIMETABLE).length) o.fixed.push({id:'lunch', title:'점심', start:12*60+10, dur:60, days:[1,2,3,4,5], skip:[], meal:true});
    o.lunchSeeded = true;
  }
  if(!o.schoolBlankSeeded){
    const have = new Set(o.fixed.map(f => f.id));
    schoolSeed().filter(f => f.blank && !have.has(f.id)).forEach(f => o.fixed.push(f));
    o.schoolBlankSeeded = true;
  }
  if(!Array.isArray(o.schoolOff)) o.schoolOff = [];
  return o;
}
function loadLocal(){ try{ const r = localStorage.getItem(LS); return r ? normalize(JSON.parse(r)) : null; }catch(e){ return null; } }

let S = loadLocal() || normalize(null);
let cur = todayKey(), view = 'plan', drag = null, SH = null, remoteRef = null, syncOn = false;

/* ---------- model ---------- */
const dayList = k => (S.days[k] ||= []);
const catOf = id => S.cats.find(c => c.id === id) || {id:'etc', name:'기타', color:'#7A8699'};
const elapsedMs = b => (b.elapsed||0) + (b.runningSince ? Date.now() - b.runningSince : 0);
const effDur = b => b.done ? b.dur : Math.max(b.dur, Math.ceil(elapsedMs(b)/60000));
function findB(id){ for(const k in S.days){ const b = S.days[k].find(x => x.id === id); if(b) return {b, k}; } return {}; }

function isSelf(f, k){
  const base = !!f.selfStudy || (!!f.school && (S.selfDay || []).includes(k));
  const flip = ((S.selfFlip || {})[k] || []).includes(f.id);
  return base !== flip;
}
function fixedFor(k){
  const wd = dateOf(k).getDay();
  const off = (S.schoolOff || []).includes(k);
  return S.fixed.filter(f => f.days.includes(wd) && (!f.only || f.only === k) && !(f.skip || []).includes(k) && !(off && f.school))
    .map(f => ({f, s:f.start, d:f.dur, self:isSelf(f, k)})).sort((a,b) => a.s - b.s);
}
function layout(list, pin, k = cur){
  const fx = fixedFor(k).filter(x => !x.self && !x.f.meal);
  const arr = list.map(b => ({b, s:b.start, d:effDur(b)}));
  arr.sort((x,y) => x.s - y.s || (x.b.id === pin ? -1 : y.b.id === pin ? 1 : 0));
  let end = -Infinity;
  const free = (t, d, lo) => t >= lo && !fx.some(f => t < f.s + f.d && t + d > f.s);
  for(const a of arr){
    if(a.s < end) a.s = end;
    /* 옮기는 블록은 수업과 겹치면 뒤로 밀지 않고 가장 가까운 빈 칸(수업 앞 또는 뒤)에 붙임 → 자습 교시 안에 쏙 들어감 */
    if(pin && a.b.id === pin && !free(a.s, a.d, end)){
      let best = null;
      for(const f of fx) for(const c of [f.s - a.d, f.s + f.d]) if(free(c, a.d, Math.max(end, DAY_START)) && (best === null || Math.abs(c - a.s) < Math.abs(best - a.s))) best = c;
      if(best !== null) a.s = best;
    }
    let hit = true;
    while(hit){ hit = false; for(const f of fx) if(a.s < f.s + f.d && a.s + a.d > f.s){ a.s = f.s + f.d; hit = true; } }
    end = a.s + a.d;
  }
  return arr;
}
function commit(k, pin){ layout(dayList(k), pin, k).forEach(a => a.b.start = a.s); }
function lastEnd(k){ const a = layout(dayList(k), null, k); return a.length ? a[a.length-1].s + a[a.length-1].d : null; }
function placeStart(){
  const last = lastEnd(cur);
  if(cur === todayKey()) return Math.max(last ?? 0, Math.max(DAY_START, ceil5(nowMin())));
  return last ?? 16*60;
}
function pauseAll(){
  for(const k in S.days) for(const b of S.days[k]) if(b.runningSince){ b.elapsed = elapsedMs(b); b.runningSince = null; }
}
function toggleRun(id){
  const {b, k} = findB(id); if(!b || b.done) return;
  if(b.runningSince){ b.elapsed = elapsedMs(b); b.runningSince = null; if(S.focus && S.focus.id === id) S.focus = null; }
  else {
    pauseAll();
    if(!b.firstStartAt) b.firstStartAt = Date.now();
    if(!b.elapsed && b.startEarly == null && k === todayKey()){
      b.startEarly = Math.min(b.planStart ?? b.start, b.start) - nowMin();
      if(b.startEarly >= 10) toast(`계획보다 ${b.startEarly}분 일찍 시작했어요. 결산에 가산점이 붙어요`);
    }
    b.runningSince = Date.now();
    if(S.focus && S.focus.id !== id) S.focus = null;
    if(S.focus && S.focus.phase !== 'focus'){ S.focus.phase = 'focus'; S.focus.t0 = Date.now(); }
    if(k === todayKey()){ S.session ||= {}; const ss = S.session[k]; if(!ss) S.session[k] = {s:nowMin(), auto:true}; else if(ss.auto && ss.e != null) delete ss.e; }
  }
  commit(k, id); save(); render();
}
function complete(id, actual){
  const {b, k} = findB(id); if(!b) return;
  if(b.runningSince){ b.elapsed = elapsedMs(b); b.runningSince = null; }
  const act = Math.max(1, Math.round(actual ?? b.elapsed/60000));
  b.done = true; b.actual = act; b.dur = Math.max(act, 10); b.doneAt = Date.now();
  if(S.focus && S.focus.id === id){ S.focus = null; closeFocus(); }
  autoEnd(k);
  S.log = S.log.filter(l => l.id !== b.id);
  S.log.unshift({id:b.id, date:k, title:b.title, cat:b.cat, units:b.units||0, unit:b.unit||'', est:b.est, actual:act});
  commit(k, id); save(); render();
  toast(predPen(b) ? `예상 ${b.est}분 → 실제 ${act}분. 예상이 너무 컸어요, 예측 오류 −${predPen(b)}` : `${b.title}  예상 ${b.est}분 → 실제 ${act}분`);
}
function undone(id){
  const {b, k} = findB(id); if(!b) return;
  b.done = false; b.actual = null; b.dur = b.est;
  S.log = S.log.filter(l => l.id !== id);
  commit(k, id); save(); render();
}

/* ---------- estimation ---------- */
const sum = (a,f) => a.reduce((t,x) => t + (+x[f]||0), 0);
function suggest(cat, units, unit){
  const L = S.log.filter(l => l.cat === cat);
  if(!L.length) return null;
  const name = catOf(cat).name;
  if(units > 0){
    const U = L.filter(l => l.units > 0 && l.unit === unit);
    if(U.length){
      const per = sum(U,'actual')/sum(U,'units');
      return {min: round5(per*units), why:`${name} ${unit}당 평균 ${per.toFixed(1)}분 × ${units}`};
    }
  }
  const avg = sum(L,'actual')/L.length;
  return {min: round5(avg), why:`${name} 한 번에 평균 ${Math.round(avg)}분 (기록 ${L.length}개)`};
}
function biasFor(cat){
  const all = S.log.filter(l => l.est > 0);
  const c = all.filter(l => l.cat === cat);
  const L = c.length >= 3 ? c : all;
  if(!L.length) return null;
  return {r: sum(L,'actual')/sum(L,'est'), n: L.length};
}

/* ---------- storage ---------- */
let saveTimer = null, writing = Promise.resolve();
function prune(){
  const cut = addDays(todayKey(), -60);
  for(const k in S.days) if(k < cut || !S.days[k].length) delete S.days[k];
  for(const f of S.fixed) if(f.skip) f.skip = f.skip.filter(k => k >= cut);
  S.schoolOff = (S.schoolOff || []).filter(k => k >= cut);
  if(S.memos) S.memos = S.memos.filter(m => !(m.date && m.date < cut && m.done));
  if(S.session) for(const k in S.session) if(k < cut) delete S.session[k];
  S.fixed = S.fixed.filter(f => !f.only || f.only >= cut);
  if(S.selfDay) S.selfDay = S.selfDay.filter(k => k >= cut);
  if(S.selfFlip) for(const k in S.selfFlip) if(k < cut) delete S.selfFlip[k];
  if(S.pomoLog) for(const k in S.pomoLog) if(k < cut) delete S.pomoLog[k];
  if(S.freeMin) for(const k in S.freeMin) if(k < cut) delete S.freeMin[k];
  if(S.log.length > 1500) S.log.length = 1500;
}
function localSave(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function save(){
  S.updatedAt = Date.now();
  const before = S.ledger ? collectedSet() : null;
  const thBefore = before ? themesFor(before) : null;
  S.ledger ||= {};
  for(const k in S.days){ const r = settleDay(k); if(r) S.ledger[k] = {score:r.score, C:+r.C.toFixed(3), R:r.R == null ? null : +r.R.toFixed(3)}; else delete S.ledger[k]; }
  rareUpdate();
  if(before){
    const fresh = [...collectedSet()].filter(x => !before.has(x));
    if(fresh.length){
      S.dexNew ||= {}; fresh.forEach(x => S.dexNew[x] = 1);
      const e = DEX.find(x => x.sym === fresh[0]);
      const fz = fresh.filter(x => FREEZE_SRC.includes(x)).length;
      setTimeout(() => toast((fresh.length === 1 ? `새 원소 발견: ${e.ko} ${e.sym}` : `새 원소 ${fresh.length}개 발견`) + (fz ? `. 결정 보존권 +${fz}` : '. 도감에 추가했어요')), 1400);
    }
  }
  if(thBefore){
    const nt = [...themesFor(collectedSet())].filter(x => !thBefore.has(x));
    if(nt.length){ S.themeNew ||= {}; nt.forEach(x => S.themeNew[x] = 1);
      const t = THEMES.find(x => x.id === nt[0]); setTimeout(() => toast(`새 테마 해금: ${t.name}. 결산에서 바꿀 수 있어요`), 3600); }
  }
  prune(); localSave();
  if(remoteRef){ clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 900); }
}
function pushRemote(){
  if(!remoteRef) return;
  const data = clone(S), ref = remoteRef;
  writing = writing.then(() => ref.set(data)).catch(e => {
    if(e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')){ remoteRef = null; syncOn = false; }
  });
}
async function initSync(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc('data/users/' + id + '/planner');
    const snap = await ref.get();

  tl.style.height = (dayEnd - DAY_START)*PX + 'px';
  let html = '';
  for(let m = DAY_START; m <= dayEnd; m += 60) html += `<div class="hour" style="top:${(m-DAY_START)*PX}px"><span>${pad((m/60)%24)}</span></div>`;
  const bi = breakInfo(cur);
  let brk = '';
  if(bi){
    for(const g of bi.gaps) brk += `<div class="brk${g.len > BREAK_MAX ? ' bad' : ''}${g.len*PX < 17 ? ' slim' : ''}" style="top:${(g.s - DAY_START)*PX}px;height:${g.len*PX}px"><span>쉬는시간 ${g.len}분</span></div>`;
    if(bi.win.manual){
      brk += `<div class="swin" style="top:${(bi.win.s - DAY_START)*PX}px"><span>공부 시작 ${fmt(bi.win.s)}</span></div>`;
      if(!bi.win.open) brk += `<div class="swin end" style="top:${(bi.win.e - DAY_START)*PX}px"><span>공부 끝 ${fmt(bi.win.e)}</span></div>`;
    }
  }
  html += '<div class="lane" id="lane" style="--tick:${10*PX}px">' + brk + fx.map(fixedHTML).join('') + arr.map(blockHTML).join('') + '</div>';
  html += '<div class="now" id="nowLine" hidden></div>';
  if(!list.length && !fx.length) html += `<div class="empty glass"><b>+ 문풀</b>로 풀 문제를 넣으세요.<br>수업과 강의 시간은 알아서 피해서 놓여요.<br>▶로 시간을 재고 ✓로 끝내면, 다음부터 걸릴 시간을 제안해요.</div>`;
  tl.innerHTML = html;
  updateNowLine();
}
function updateNowLine(){
  const n = $('#nowLine'); if(!n) return;
  const m = nowMin();
  const show = cur === todayKey() && m >= DAY_START;
  n.hidden = !show;
  if(show) n.style.top = (m - DAY_START)*PX + 'px';
}

function renderStats(){
  const L = S.log;
  const syncLine = `<p class="sync">${syncOn ? '기록은 계정에 저장돼 다른 기기에서도 이어져요.' : '기록은 이 브라우저에만 저장돼요.'}</p>`;
  if(!L.length){
    statsEl.innerHTML = '<h2>기록</h2>' + `<div class="stats-empty glass">아직 기록이 없어요.<br>블록에서 ▶를 눌러 시간을 재고 ✓로 끝내면 과목별로 실제 걸린 시간이 쌓여요. 두세 번만 해도 예상 시간이 달라져요.</div>` + syncLine;
    return;
  }
  const withEst = L.filter(l => l.est > 0);
  const r = sum(withEst,'actual')/Math.max(1, sum(withEst,'est'));
  let lead = `예상 대비 실제<b>×${r.toFixed(2)}</b>` + (r >= 1.05 ? '예상보다 오래 걸리는 편이에요.' : r <= 0.95 ? '예상보다 빨리 끝내는 편이에요.' : '예상이 거의 정확해요.');
  const groups = {};
  for(const l of L) (groups[l.cat] ||= []).push(l);
  const rows = Object.entries(groups).map(([cat, g]) => {
    const c = catOf(cat), n = g.length;
    const ea = sum(g,'est')/n, aa = sum(g,'actual')/n;
    const units = {};
    for(const l of g) if(l.units > 0) (units[l.unit] ||= []).push(l);
    const per = Object.entries(units).map(([u, U]) => `${esc(u)}당 <b>${(sum(U,'actual')/sum(U,'units')).toFixed(1)}분</b>`).join('  ');
    return {c, n, ea, aa, per};
  }).sort((a,b) => b.n - a.n);
  const max = Math.max(...rows.map(x => Math.max(x.ea, x.aa)), 1);
  const rowsHTML = rows.map(x => `<div class="cat-row glass" style="--c:${x.c.color}">
    <div class="h"><b>${esc(x.c.name)}</b><span>기록 ${x.n}개</span></div>
    <p>예상 ${Math.round(x.ea)}분 / 실제 <b>${Math.round(x.aa)}분</b>  ×${(x.aa/Math.max(1,x.ea)).toFixed(2)}${x.per ? '<br>' + x.per : ''}</p>
    <div class="cmp"><div class="a" style="width:${x.aa/max*100}%"></div><div class="e" style="left:calc(${x.ea/max*100}% - 1px)"></div></div></div>`).join('');
  const logHTML = L.slice(0, 40).map((l, i) => {
    const d = dateOf(l.date);
    return `<li><span class="d">${d.getMonth()+1}/${d.getDate()}</span><span class="n">${esc(l.title)}</span>
      <span class="v">${l.est} → <b>${l.actual}</b>분</span><button data-del="${i}" aria-label="기록 삭제">✕</button></li>`;
  }).join('');
  statsEl.innerHTML = '<h2>기록</h2>' + `<p class="lead glass">${lead}</p>
    <h2>과목별</h2><p class="legend">막대는 실제 평균, 세로선은 예상 평균이에요.</p>${rowsHTML}
    <h2>최근 기록</h2><ul class="log glass">${logHTML}</ul>${syncLine}`;
}

/* ---------- drag ---------- */
function startDrag(id, mode, e){
  e.preventDefault(); e.stopPropagation();
  const list = dayList(cur), b = list.find(x => x.id === id); if(!b) return;
  commit(cur);
  drag = {id, mode, y0: e.clientY + scroller.scrollTop, orig:{start:b.start, dur:b.dur},
          snap: list.map(x => [x.id, x.start]), el: e.currentTarget, moved:false};
  e.currentTarget.setPointerCapture(e.pointerId);
  const blk = tl.querySelector(`.blk[data-id="${id}"]`); if(blk) blk.classList.add('dragging');
  e.currentTarget.addEventListener('pointermove', onDragMove);
  e.currentTarget.addEventListener('pointerup', endDrag);
  e.currentTarget.addEventListener('pointercancel', endDrag);
}
let dragRaf = 0, dragEv = null;
function onDragMove(e){
  if(!drag) return;
  dragEv = e;
  if(!dragRaf) dragRaf = requestAnimationFrame(() => { dragRaf = 0; if(drag && dragEv) dragFrame(dragEv); });
}
function dragFrame(e){
  const sr = scroller.getBoundingClientRect(), topEdge = sr.top, botEdge = sr.bottom;
  if(e.clientY < topEdge + 40) scroller.scrollTop -= 12;
  else if(e.clientY > botEdge - 40) scroller.scrollTop += 12;
  const dm = Math.round((e.clientY + scroller.scrollTop - drag.y0)/PX/SNAP)*SNAP;
  if(dm !== 0) drag.moved = true;
  const list = dayList(cur);
  const snap = new Map(drag.snap);
  for(const x of list) x.start = snap.get(x.id);
  const b = list.find(x => x.id === drag.id);
  if(drag.mode === 'move') b.start = Math.max(DAY_START, drag.orig.start + dm);
  else b.dur = Math.max(10, drag.orig.dur + dm);
  if(!drag.els){ drag.els = new Map(); tl.querySelectorAll('.blk[data-id]').forEach(el => drag.els.set(el.dataset.id, {el, tm:el.querySelector('.tm'), t:null, h:null})); }
  for(const a of layout(list, drag.id)){
    const c = drag.els.get(a.b.id); if(!c) continue;
    const t = (a.s - DAY_START)*PX + 1, h = a.d*PX - 2;
    if(t !== c.t){ c.el.style.top = t + 'px'; c.t = t; }
    if(h !== c.h){ c.el.style.height = h + 'px'; c.h = h; }
    if(c.tm){ const txt = fmt(a.s) + '–' + fmt(a.s + a.d); if(c.tm.textContent !== txt) c.tm.textContent = txt; }
  }
}
function endDrag(){
  if(!drag) return;
  if(dragRaf){ cancelAnimationFrame(dragRaf); dragRaf = 0; }
  const d = drag; drag = null;
  d.el.removeEventListener('pointermove', onDragMove);
  d.el.removeEventListener('pointerup', endDrag);
  d.el.removeEventListener('pointercancel', endDrag);
  const b = dayList(cur).find(x => x.id === d.id);
  if(b && d.mode === 'resize' && !b.done) b.est = b.dur;
  commit(cur, d.id); save(); render();
}

/* ---------- sheet ---------- */
function openSheet(mode, id, kind){

  if(b){

         start:fmt(Math.min(b.start, 24*60-5)), actual: b.done ? b.actual : (Math.round(elapsedMs(b)/60000) || b.est)};
  } else {
    d = {title:'', cat:S.cats.some(c => c.id === S.lastCat) ? S.lastCat : S.cats[0].id, units:'', unit:'문제', est:30,
         start:fmt(Math.min(placeStart(), 24*60-5)), actual:''};
    if(kind === 'review') d.est = 20;
    else if(kind === 'lecture') d.est = 50;
    else { const sg = suggest(d.cat, 0, d.unit); if(sg) d.est = sg.min; }

  d.progress = b ? progOf(b) : 0;
